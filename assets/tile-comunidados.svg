<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" role="img" aria-labelledby="title desc">
  <title id="title">ComunidadOS</title>
  <desc id="desc">A civic agent pipeline processes a Câmara dos Deputados voting link and returns an accessible explanation in conversation.</desc>
  <style>@media (prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <rect width="580" height="340" rx="24" fill="#EAF4EE"/>
  <circle cx="544" cy="-8" r="105" fill="#F2C94C" opacity=".58"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="26" y="40" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5" fill="#28735A">CIVIC AGENT · LINK TO CONTEXT</text>
    <text x="25" y="82" font-size="35" font-weight="760" fill="#183E34">ComunidadOS</text>
    <text x="27" y="108" font-size="14" fill="#547067">legislative data, explained in plain language</text>
  </g>

  <g transform="translate(27 137)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.2" fill="#66827A">AGENT PIPELINE</text>
    <path d="M16 24v143" stroke="#B9D4C8" stroke-width="4" stroke-linecap="round"/>
    <circle class="motion" cx="16" cy="24" r="5" fill="#F2C94C"><animate attributeName="cy" values="24;167;24" dur="3.4s" repeatCount="indefinite"/></circle>
    <g transform="translate(0 19)"><circle cx="16" cy="16" r="16" fill="#1E755B"/><path d="M10 17h12m-9-5 6 10" stroke="#FFF" stroke-width="2" stroke-linecap="round"/><text x="44" y="13" font-size="12" font-weight="750" fill="#183E34">SHARED LINK</text><text x="44" y="29" font-size="11" fill="#66827A">camara.leg.br</text></g>
    <g transform="translate(0 70)"><circle cx="16" cy="16" r="16" fill="#1E755B"/><path d="M9 12h14M9 17h10M9 22h12" stroke="#FFF" stroke-width="2" stroke-linecap="round"/><text x="44" y="13" font-size="12" font-weight="750" fill="#183E34">LEGISLATIVE MCP</text><text x="44" y="29" font-size="11" fill="#66827A">proposal + votes</text></g>
    <g transform="translate(0 121)"><circle cx="16" cy="16" r="16" fill="#183E34"/><path d="m9 16 5 5 9-12" fill="none" stroke="#F2C94C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="13" font-size="12" font-weight="750" fill="#183E34">AGENT ANSWER</text><text x="44" y="29" font-size="11" fill="#66827A">context, then summary</text></g>
  </g>

  <g transform="translate(292 120)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="260" height="194" rx="20" fill="#FFF" stroke="#CADDD4"/>
    <text x="18" y="25" font-size="10" font-weight="700" fill="#778B83">LINK YOU SHARED</text>
    <g transform="translate(16 36)">
      <rect width="228" height="92" rx="11" fill="#F7F7F3" stroke="#D8DDD7"/>
      <rect width="228" height="25" rx="11" fill="#17633F"/>
      <circle cx="15" cy="12.5" r="6" fill="#F2C94C"/><path d="m12 13 3-5 3 5-3 5z" fill="#17633F"/>
      <text x="27" y="17" font-size="9" font-weight="750" fill="#FFF">CÂMARA DOS DEPUTADOS</text>
      <text x="12" y="47" font-size="13" font-weight="760" fill="#243A33">PDL 995/2026</text>
      <text x="12" y="63" font-size="9" fill="#697A74">Resultado da votação</text>
      <rect x="12" y="71" width="151" height="7" rx="3" fill="#53A777"/><rect x="163" y="71" width="23" height="7" rx="3" fill="#D56A5C"/>
      <text x="12" y="88" font-size="8" fill="#557067">404 sim · 61 não · 1 abstenção</text>
      <text x="216" y="87" text-anchor="end" font-size="8" fill="#28735A">camara.leg.br ↗</text>
    </g>
    <g transform="translate(39 140)">
      <rect width="205" height="40" rx="13" fill="#1E755B"/>
      <text x="14" y="17" font-size="10" fill="#A9E0CC">COMUNIDADOS</text>
      <text x="14" y="32" font-size="12" font-weight="700" fill="#FFF">Aprovado: 404 votos a favor.</text>
    </g>
  </g>
</svg>
