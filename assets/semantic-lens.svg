<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">semantic lens — find the photo you remember</title>
  <desc id="desc">A remembered phrase is typed into semantic search. A beach photo emerges from a loose pile, moves closer, and is identified as the best match.</desc>

  <defs>
    <filter id="card-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#173c40" flood-opacity=".14"/>
    </filter>
    <filter id="match-shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#ad492f" flood-opacity=".24"/>
    </filter>
    <clipPath id="query-clip">
      <rect class="type-clip animated" x="66" y="0" width="0" height="64"/>
    </clipPath>
    <clipPath id="beach-photo-clip">
      <rect x="-67" y="-79" width="134" height="117" rx="8"/>
    </clipPath>

    <style>
      .sans{font-family:Inter,Arial,sans-serif}
      .mono{font-family:Consolas,monospace}
      .animated{animation-duration:6.4s;animation-iteration-count:infinite}
      .type-clip{animation-name:typeReveal;animation-timing-function:steps(36,end)}
      .cursor-travel{animation-name:cursorTravel;animation-timing-function:steps(36,end)}
      .cursor-blink{animation:cursorBlink .76s step-end infinite}
      .search-pulse{transform-box:fill-box;transform-origin:center;animation-name:searchPulse}
      .pile-card{transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.4,.14,.3,1)}
      .mountain-motion{animation-name:mountainRecoil}
      .portrait-motion{animation-name:portraitRecoil}
      .forest-motion{animation-name:forestRecoil}
      .city-motion{animation-name:cityRecoil}
      .front-motion{animation-name:frontRecoil}
      .pile-fade{animation-name:pileFade}
      .match-motion{transform-box:fill-box;transform-origin:center;animation-name:matchEmerge}
      .match-outline{stroke-dasharray:760;stroke-dashoffset:760;animation-name:outlineDraw}
      .match-inner-outline{stroke-dasharray:690;stroke-dashoffset:690;animation-name:innerOutlineDraw}
      .match-badge{transform-box:fill-box;transform-origin:center;animation-name:badgeLand}
      .match-meta{animation-name:metaReveal}
      .status-dot{transform-box:fill-box;transform-origin:center;animation-name:statusPulse}
      .cta-arrow{animation:arrowNudge 2.2s cubic-bezier(.2,0,.38,.9) infinite}

      @keyframes typeReveal{
        0%,4%{width:0}
        26%,86%{width:300px}
        94%,100%{width:0}
      }
      @keyframes cursorTravel{
        0%,4%{transform:translateX(0)}
        26%,86%{transform:translateX(285px)}
        94%,100%{transform:translateX(0)}
      }
      @keyframes cursorBlink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @keyframes searchPulse{
        0%,24%{opacity:0;transform:scale(.8)}
        28%{opacity:.34;transform:scale(1)}
        35%{opacity:0;transform:scale(1.75)}
        100%{opacity:0;transform:scale(1.75)}
      }
      @keyframes pileFade{
        0%,29%{opacity:1}
        46%,82%{opacity:.78}
        94%,100%{opacity:1}
      }
      @keyframes mountainRecoil{
        0%,29%{transform:translate(0,0) rotate(0)}
        48%,82%{transform:translate(-18px,-7px) rotate(-2deg)}
        94%,100%{transform:translate(0,0) rotate(0)}
      }
      @keyframes portraitRecoil{
        0%,29%{transform:translate(0,0) rotate(0)}
        48%,82%{transform:translate(19px,-9px) rotate(2deg)}
        94%,100%{transform:translate(0,0) rotate(0)}
      }
      @keyframes forestRecoil{
        0%,29%{transform:translate(0,0) rotate(0)}
        48%,82%{transform:translate(-14px,15px) rotate(2deg)}
        94%,100%{transform:translate(0,0) rotate(0)}
      }
      @keyframes cityRecoil{
        0%,29%{transform:translate(0,0) rotate(0)}
        48%,82%{transform:translate(18px,16px) rotate(-2deg)}
        94%,100%{transform:translate(0,0) rotate(0)}
      }
      @keyframes frontRecoil{
        0%,29%{transform:translate(0,0) rotate(0);opacity:1}
        44%,82%{transform:translate(145px,95px) rotate(6deg);opacity:1}
        94%,100%{transform:translate(0,0) rotate(0);opacity:1}
      }
      @keyframes matchEmerge{
        0%,28%{transform:translate(0,0) rotate(0) scale(.94);animation-timing-function:cubic-bezier(.4,.14,.3,1)}
        33%{transform:translate(-2px,-8px) rotate(1deg) scale(.97);animation-timing-function:cubic-bezier(0,0,.3,1)}
        47%{transform:translate(-10px,-69px) rotate(-5deg) scale(1.22);animation-timing-function:cubic-bezier(.2,0,.38,.9)}
        53%,82%{transform:translate(-9px,-61px) rotate(-1deg) scale(1.17);animation-timing-function:cubic-bezier(.4,.14,.3,1)}
        94%,100%{transform:translate(0,0) rotate(0) scale(.94)}
      }
      @keyframes outlineDraw{
        0%,43%{opacity:0;stroke-dashoffset:760}
        45%{opacity:1;stroke-dashoffset:760}
        56%,82%{opacity:1;stroke-dashoffset:0}
        92%,100%{opacity:0;stroke-dashoffset:0}
      }
      @keyframes innerOutlineDraw{
        0%,45%{opacity:0;stroke-dashoffset:690}
        47%{opacity:1;stroke-dashoffset:690}
        58%,82%{opacity:1;stroke-dashoffset:0}
        92%,100%{opacity:0;stroke-dashoffset:0}
      }
      @keyframes badgeLand{
        0%,50%{opacity:0;transform:translateY(7px) scale(.72)}
        56%{opacity:1;transform:translateY(-2px) scale(1.08)}
        60%,82%{opacity:1;transform:translateY(0) scale(1)}
        92%,100%{opacity:0;transform:translateY(4px) scale(.9)}
      }
      @keyframes metaReveal{
        0%,46%{opacity:0;transform:translateY(4px)}
        55%,82%{opacity:1;transform:translateY(0)}
        92%,100%{opacity:0;transform:translateY(4px)}
      }
      @keyframes statusPulse{
        0%,25%{opacity:.35;transform:scale(.72)}
        31%{opacity:1;transform:scale(1.35)}
        38%,82%{opacity:1;transform:scale(1)}
        92%,100%{opacity:.35;transform:scale(.72)}
      }
      @keyframes arrowNudge{0%,72%,100%{transform:translate(0,0)}82%{transform:translate(4px,-4px)}}

      @media (prefers-reduced-motion:reduce){
        .animated,.cursor-blink,.cta-arrow{animation:none!important}
        .type-clip{width:300px}
        .cursor-travel{transform:translateX(285px)}
        .pile-fade{opacity:.78}
        .mountain-motion{transform:translate(-18px,-7px) rotate(-2deg)}
        .portrait-motion{transform:translate(19px,-9px) rotate(2deg)}
        .forest-motion{transform:translate(-14px,15px) rotate(2deg)}
        .city-motion{transform:translate(18px,16px) rotate(-2deg)}
        .front-motion{transform:translate(145px,95px) rotate(6deg);opacity:1}
        .match-motion{transform:translate(-9px,-61px) rotate(-1deg) scale(1.17)}
        .match-outline,.match-inner-outline{opacity:1;stroke-dashoffset:0}
        .match-badge,.match-meta{opacity:1;transform:none}
      }
    </style>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#fbf6ea"/>
  <path d="M0 424C160 389 312 458 505 429C672 404 873 436 1200 357V500H0Z" fill="#eadfbe"/>

  <!-- original identity and product context -->
  <g class="sans">
    <text x="52" y="66" fill="#ad492f" font-size="23" font-style="italic">flagship project</text>
    <text x="50" y="140" fill="#123b3f" font-size="64" font-weight="760">semantic lens</text>
    <text x="53" y="183" fill="#526d6d" font-size="23">find the photo you remember.</text>

    <g transform="translate(52 226)">
      <rect width="505" height="64" rx="32" fill="#fffdfa" stroke="#cfbea0" stroke-width="2"/>
      <circle cx="34" cy="31" r="10" fill="none" stroke="#ad492f" stroke-width="3"/>
      <path d="M41 38l9 9" fill="none" stroke="#ad492f" stroke-width="3" stroke-linecap="round"/>
      <circle class="search-pulse animated" cx="34" cy="31" r="13" fill="none" stroke="#ad492f" stroke-width="2"/>
      <g clip-path="url(#query-clip)">
        <text x="66" y="39" fill="#536c6d" font-size="18">sunset at the beach with friends...</text>
      </g>
      <g class="cursor-travel animated">
        <rect class="cursor-blink" x="67" y="19" width="2.5" height="26" rx="1.25" fill="#ad492f"/>
      </g>
    </g>

    <g transform="translate(52 311)" font-size="13" fill="#173f43">
      <g>
        <rect width="108" height="35" rx="18" fill="#d8eeea"/>
        <text x="54" y="23" text-anchor="middle">BILINGUAL</text>
      </g>
      <g transform="translate(118)">
        <rect width="119" height="35" rx="18" fill="#f7d8c4"/>
        <text x="59.5" y="23" text-anchor="middle">MEMORY-LED</text>
      </g>
      <g transform="translate(247)">
        <rect width="139" height="35" rx="18" fill="#dce4f5"/>
        <text x="69.5" y="23" text-anchor="middle">BROWSER DEMO</text>
      </g>
    </g>

    <text x="52" y="417" fill="#ad492f" font-size="18" font-weight="700">OPEN THE SHOWCASE</text>
    <text class="cta-arrow" x="265" y="417" fill="#ad492f" font-size="21">↗</text>
  </g>

  <!-- loose camera roll: the match begins behind the front card -->
  <g class="sans">
    <text x="620" y="63" fill="#6f8281" font-size="13" font-weight="700" letter-spacing="6">12 PHOTOS · SORTED BY MEANING</text>
    <circle class="status-dot animated" cx="1116" cy="59" r="4" fill="#ad492f"/>

    <g transform="translate(748 225) rotate(-10) scale(.96)" filter="url(#card-shadow)">
      <g class="pile-card mountain-motion pile-fade animated">
        <rect x="-73" y="-92" width="146" height="184" rx="12" fill="#fffdfa" stroke="#d6c5a8"/>
        <rect x="-64" y="-82" width="128" height="119" rx="7" fill="#a8d2ce"/>
        <path d="M-64 37L-18-12 10 17 37-31 64 8V37Z" fill="#234e54"/>
        <circle cx="29" cy="-49" r="15" fill="#f4d17f"/>
        <text x="-58" y="72" fill="#746c61" font-size="10">serra · morning</text>
      </g>
    </g>

    <g transform="translate(986 228) rotate(8) scale(.92)" filter="url(#card-shadow)">
      <g class="pile-card portrait-motion pile-fade animated">
        <rect x="-73" y="-92" width="146" height="184" rx="12" fill="#fffdfa" stroke="#d6c5a8"/>
        <rect x="-64" y="-82" width="128" height="119" rx="7" fill="#d9b393"/>
        <circle cx="0" cy="-42" r="25" fill="#2d6270"/>
        <path d="M-41 37C-36 1-18-10 0-10S36 1 41 37Z" fill="#ad492f"/>
        <text x="-58" y="72" fill="#746c61" font-size="10">portrait · ana</text>
      </g>
    </g>

    <g transform="translate(762 342) rotate(-5) scale(1.01)" filter="url(#card-shadow)">
      <g class="pile-card forest-motion pile-fade animated">
        <rect x="-73" y="-92" width="146" height="184" rx="12" fill="#fffdfa" stroke="#d6c5a8"/>
        <rect x="-64" y="-82" width="128" height="119" rx="7" fill="#83a293"/>
        <circle cx="-34" cy="-42" r="27" fill="#235648"/>
        <circle cx="0" cy="-55" r="31" fill="#235648"/>
        <circle cx="36" cy="-40" r="28" fill="#235648"/>
        <rect x="-9" y="-13" width="18" height="50" fill="#765b48"/>
        <text x="-58" y="72" fill="#746c61" font-size="10">forest · trail</text>
      </g>
    </g>

    <g transform="translate(966 342) rotate(5) scale(.96)" filter="url(#card-shadow)">
      <g class="pile-card city-motion pile-fade animated">
        <rect x="-73" y="-92" width="146" height="184" rx="12" fill="#fffdfa" stroke="#d6c5a8"/>
        <rect x="-64" y="-82" width="128" height="119" rx="7" fill="#bdd3d4"/>
        <rect x="-55" y="-28" width="27" height="65" fill="#526f77"/>
        <rect x="-20" y="-48" width="34" height="85" fill="#526f77"/>
        <rect x="21" y="-17" width="40" height="54" fill="#526f77"/>
        <text x="-58" y="72" fill="#746c61" font-size="10">city · blue hour</text>
      </g>
    </g>

    <!-- matching memory, initially tucked beneath the front-most card -->
    <g transform="translate(870 268)" filter="url(#match-shadow)">
      <g class="match-motion animated">
        <rect x="-76" y="-94" width="152" height="188" rx="12" fill="#fffdfa" stroke="#d6c5a8"/>
        <g clip-path="url(#beach-photo-clip)">
          <rect x="-67" y="-79" width="134" height="117" fill="#8bc2c2"/>
          <circle cx="28" cy="-50" r="20" fill="#ffd98d"/>
          <path d="M-67-7Q-24-27 7-9T67-10V20Q22 8-19 22T-67 17Z" fill="#f4f0d8"/>
          <path d="M-67 17Q-18 6 18 23T67 18V38H-67Z" fill="#27525a"/>
          <circle cx="-23" cy="0" r="8" fill="#ad492f"/>
          <circle cx="-5" cy="5" r="8" fill="#2c5962"/>
          <circle cx="13" cy="-3" r="8" fill="#e4b36a"/>
        </g>
        <text class="match-meta animated" x="-61" y="73" fill="#746c61" font-size="10">praia · friends · sunset</text>
        <rect class="match-outline animated" x="-84" y="-102" width="168" height="204" rx="18" fill="none" stroke="#ad492f" stroke-width="3"/>
        <rect class="match-inner-outline animated" x="-78" y="-96" width="156" height="192" rx="14" fill="none" stroke="#ad492f" stroke-width="2"/>
        <g transform="translate(1 -112)">
          <g class="match-badge animated" opacity="0">
            <rect x="0" y="0" width="91" height="25" rx="12.5" fill="#ad492f"/>
            <text x="45.5" y="17" text-anchor="middle" fill="#fffdfa" font-size="10" font-weight="700">BEST MATCH</text>
          </g>
        </g>
      </g>
    </g>

    <!-- front card moves aside, making the selected photo feel retrieved rather than spawned -->
    <g transform="translate(877 278) rotate(2)" filter="url(#card-shadow)">
      <g class="pile-card front-motion animated">
        <rect x="-73" y="-92" width="146" height="184" rx="12" fill="#fffdfa" stroke="#d6c5a8"/>
        <rect x="-64" y="-82" width="128" height="119" rx="7" fill="#e8c796"/>
        <circle cx="-27" cy="-33" r="22" fill="#ad492f"/>
        <circle cx="22" cy="-33" r="22" fill="#2d6270"/>
        <path d="M-64 37C-58 4-34 0-17 0S8 10 13 23C24 7 40 0 55 5C62 9 65 18 64 37Z" fill="#65847a"/>
        <text x="-58" y="72" fill="#746c61" font-size="10">friends · january</text>
      </g>
    </g>
  </g>
</svg>
